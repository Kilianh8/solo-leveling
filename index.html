<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Solo Leveling</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Solo Leveling">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--p1:#0c0c0f;--p2:#141418;--p3:#1b1b21;--line:#222229;--tx:#f4f4f6;--mu:#8a8a96;--mu2:#5c5c66;--acc:#8b5cf6;--acc2:#a78bfa;--bad:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;font-size:15px;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx);background:var(--p3);border:1px solid transparent;border-radius:8px;padding:9px 10px;width:100%;outline:none}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#8a8a96 50%),linear-gradient(135deg,#8a8a96 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
input[type=range]{padding:0;accent-color:var(--acc)}
.hd{font-family:Rajdhani,sans-serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.mu{color:var(--mu)} .sm{font-size:13px} .xs{font-size:11.5px}
#app{max-width:560px;margin:0 auto;padding:12px 14px 92px}
.top{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;margin:2px 0 14px}
.top .t{font-family:Rajdhani;font-weight:700;font-size:20px;letter-spacing:.2em;text-align:center}
.top .t b{color:var(--acc2);font-weight:700}
.sync{font-size:10px;letter-spacing:.08em;color:var(--mu2);margin-right:10px}
.sync.on{color:#6b6b76}
.card{background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.sec{font-family:Rajdhani;font-weight:700;font-size:13px;letter-spacing:.16em;color:var(--mu);margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;text-transform:uppercase}
.sec .r{font-family:Inter;letter-spacing:0;font-weight:500;font-size:12px;text-transform:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:10px;background:var(--p3);border:1px solid var(--line);font-weight:600;font-size:14px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.bad{color:var(--bad)}
.btn.full{width:100%}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.link{color:var(--acc2);font-weight:600;font-size:14px;padding:10px;width:100%;text-align:center}
.link.bad{color:var(--bad)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{background:var(--p2);border-radius:10px;padding:9px 10px}
.stat .v{font-family:Rajdhani;font-weight:700;font-size:19px}
.stat .k{font-size:10.5px;color:var(--mu);letter-spacing:.04em}
.chip{display:inline-block;padding:6px 11px;border-radius:99px;background:var(--p2);border:1px solid var(--line);font-size:12.5px;margin:0 6px 6px 0;white-space:nowrap;color:var(--mu)}
.chip.on{border-color:var(--acc);color:#fff;background:#1a1426}
.chips{display:flex;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(0,0,0,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.nav .in{display:flex;max-width:560px;width:100%}
.nav button{flex:1;padding:12px 0 14px;font-family:Rajdhani;font-weight:700;font-size:13px;letter-spacing:.16em;color:var(--mu2);display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button svg{width:21px;height:21px}
.nav button.on{color:#fff}
.nav button.on svg{color:var(--acc2)}
.wobar{position:fixed;left:50%;transform:translateX(-50%);bottom:68px;width:min(532px,calc(100% - 28px));z-index:19;background:var(--acc);border-radius:12px;padding:11px 14px;display:flex;justify-content:space-between;font-weight:600;color:#fff}
.rk{font-family:Rajdhani;font-weight:700;display:inline-block;text-align:center;line-height:1}
.rk-F,.rk-E,.rk-D{color:#7c7c88}.rk-C,.rk-B{color:#f4f4f6}.rk-A,.rk-S,.rk-SS{color:var(--acc2)}
.bar{height:4px;background:#1f1f26;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #18181d}
.li:last-child{border-bottom:0}
.tag{font-size:10px;padding:2px 6px;border-radius:5px;background:var(--p3);color:var(--mu);letter-spacing:.06em;font-weight:600}
.tag.acc{color:var(--acc2)}
.tag.weak{color:#fca5a5}.tag.strong{color:var(--acc2)}
.banner{border:1px solid var(--acc);border-radius:12px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;background:#0f0b18}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
details[open] .chev{transform:rotate(90deg)}
.chev{color:var(--mu2);transition:transform .15s;display:inline-block}
.empty{text-align:center;color:var(--mu);padding:22px 10px}
svg text{font-family:Rajdhani,sans-serif}
/* quest */
.quest{position:relative;border:1px solid #3b2f63;border-radius:4px;padding:22px 18px 16px;margin:22px 0 14px;background:radial-gradient(ellipse at 50% 0%,rgba(139,92,246,.10),transparent 70%),var(--p1)}
.quest .cn{position:absolute;width:16px;height:16px;border-color:var(--acc2);border-style:solid}
.quest .tl{top:-1px;left:-1px;border-width:2px 0 0 2px}.quest .tr{top:-1px;right:-1px;border-width:2px 2px 0 0}.quest .bl{bottom:-1px;left:-1px;border-width:0 0 2px 2px}.quest .br{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
.quest .qh{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--bg);padding:0 12px;font-family:Rajdhani;font-weight:700;letter-spacing:.3em;font-size:12px;color:var(--acc2);white-space:nowrap}
.quest .qt{font-family:Rajdhani;font-weight:700;font-size:21px;letter-spacing:.05em;text-align:center;line-height:1.15}
.quest .div{display:flex;align-items:center;gap:8px;color:var(--acc);margin:10px 0;font-size:10px}
.quest .div::before,.quest .div::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,#3b2f63,transparent)}
/* workout */
#wo{position:fixed;inset:0;background:var(--bg);z-index:40;overflow-y:auto;display:none}
#wo.open{display:block}
.wohd{position:sticky;top:0;z-index:5;background:rgba(0,0,0,.96);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:10px 12px}
.wohd .tm{flex:1;text-align:center;font-family:Rajdhani;font-weight:600;font-size:18px;color:var(--mu)}
.iconbtn{width:40px;height:36px;border-radius:10px;background:var(--p2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--mu)}
.iconbtn.act{border-color:var(--acc);color:#fff}
.wobody{max-width:560px;margin:0 auto;padding:14px 12px 60px}
.excard{margin-bottom:24px;border-left:2px solid transparent;padding-left:6px}
.excard.ss{border-left-color:var(--acc)}
.exname{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.exname .n{flex:1;font-weight:600;font-size:16.5px;color:var(--acc2);line-height:1.2}
.note{background:var(--p2);border-radius:8px;padding:8px 10px;margin:4px 0 8px;font-size:14px;width:100%;border:0}
.note.empty{background:none;padding:2px 0;color:var(--mu);font-size:13px}
.srow,.shd{display:grid;grid-template-columns:34px 1fr 68px 62px 42px;gap:8px;align-items:center}
.shd{font-size:10px;letter-spacing:.12em;color:var(--mu2);font-weight:700;padding:4px 0;text-align:center}
.shd div:nth-child(2){text-align:left;padding-left:2px}
.srow{padding:3px 0;border-radius:8px;position:relative}
.srow.swiping{background:rgba(248,113,113,.22)!important}
.srow.done{background:rgba(139,92,246,.10)}
.srow .sn{font-family:Rajdhani;font-weight:700;font-size:17px;height:38px;border-radius:8px}
.sn.t-w{color:#d4a64a}.sn.t-d{color:#7aa2ff}.sn.t-f{color:var(--bad)}
.srow .pv{color:var(--mu2);font-size:13.5px;text-align:left;height:38px;padding-left:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow input{height:40px;text-align:center;font-size:17px;font-weight:600;padding:4px;background:var(--p2)}
.srow input::placeholder{color:#55555f;font-weight:500}
.srow.done input{background:transparent}
.chk{height:40px;border-radius:9px;background:var(--p2);font-size:17px;color:var(--mu2)}
.srow.done .chk{background:var(--acc);color:#fff}
.rest{display:flex;align-items:center;gap:8px;height:18px;margin:1px 0 3px;cursor:pointer}
.rest .ln{flex:1;height:2px;background:#19191e;border-radius:3px;overflow:hidden}
.rest .ln i{display:block;height:100%;width:0;background:var(--acc2)}
.rest span{font-family:Rajdhani;font-weight:700;color:#4c4c57;font-size:13px;min-width:36px;text-align:center}
.rest.live span{color:#fff}
.rest.live .ln{background:#2a2340}
/* sheet */
#sheet .bd{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:60}
#sheet .sh{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100%);max-height:90vh;overflow-y:auto;background:#0b0b0e;border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;z-index:61;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
#sheet .sh.tall{height:90vh}
.sh h3{margin:0 0 12px;font-family:Rajdhani;letter-spacing:.1em;font-size:19px;text-transform:uppercase}
.grab{width:36px;height:4px;border-radius:4px;background:#2a2a31;margin:-6px auto 12px}
.menu button{display:block;width:100%;text-align:left;padding:13px 4px;border-bottom:1px solid #18181d;font-size:15px}
.menu button:last-child{border-bottom:0}
.menu button.bad{color:var(--bad)}
.field{margin-bottom:10px}
.field label{display:block;font-size:11px;color:var(--mu);margin-bottom:4px;letter-spacing:.05em}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:90;pointer-events:none}
#toast div{background:#17171c;border:1px solid var(--acc);border-radius:10px;padding:10px 16px;font-weight:600;margin-bottom:6px}
.ro-item{display:flex;align-items:center;gap:12px;height:52px;padding:0 10px;background:var(--p2);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;touch-action:none;user-select:none}
.ro-item.drag{border-color:var(--acc);z-index:3;position:relative;background:#16121f}
.ro-item .hdl{font-size:20px;color:var(--mu);padding:8px 4px;touch-action:none}
table.rt{width:100%;border-collapse:collapse;font-size:13px}
table.rt td,table.rt th{padding:6px 4px;border-bottom:1px solid #18181d;text-align:left}
table.rt th{color:var(--mu2);font-weight:600;font-size:10.5px;letter-spacing:.08em}
table.rt tr.me td{background:rgba(139,92,246,.12)}
.bodywrap{perspective:1000px;position:relative;margin-top:6px}
.flip{position:relative;height:330px;transition:transform .7s cubic-bezier(.3,.1,.2,1);transform-style:preserve-3d}
.flip.back{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;justify-content:center}
.face.bk{transform:rotateY(180deg)}
.face svg{height:100%}
.rot{position:absolute;right:0;top:0}
.fx{position:fixed;inset:0;z-index:120;background:radial-gradient(circle at 50% 45%,rgba(76,29,149,.55),rgba(0,0,0,.96) 60%);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:fxIn .25s ease-out;overflow:hidden}
@keyframes fxIn{from{opacity:0}to{opacity:1}}
.fx .stage{position:relative;width:240px;height:220px}
.fx .L{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Rajdhani;font-weight:700;font-size:170px;line-height:1;color:#e9e3ff}
.fx .old{animation:shake .7s ease-in-out}
.fx .old.a{clip-path:polygon(0 0,58% 0,44% 100%,0 100%);animation:shake .7s ease-in-out,splitL .5s .75s forwards ease-in}
.fx .old.b{clip-path:polygon(58% 0,100% 0,100% 100%,44% 100%);animation:shake .7s ease-in-out,splitR .5s .75s forwards ease-in}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-4px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-6px,1px)}80%{transform:translate(4px,3px)}}
@keyframes splitL{to{transform:translate(-90px,40px) rotate(-25deg);opacity:0}}
@keyframes splitR{to{transform:translate(90px,50px) rotate(22deg);opacity:0}}
.fx .new{opacity:0;color:#fff;text-shadow:0 0 18px #a78bfa,0 0 42px #7c3aed,0 0 80px #6d28d9;animation:newIn .6s 1.15s forwards cubic-bezier(.2,1.6,.4,1)}
@keyframes newIn{from{opacity:0;transform:scale(2.6)}to{opacity:1;transform:scale(1)}}
.fx .rays{position:absolute;left:50%;top:50%;width:520px;height:520px;margin:-260px 0 0 -260px;background:repeating-conic-gradient(rgba(167,139,250,.18) 0 6deg,transparent 6deg 18deg);border-radius:50%;opacity:0;animation:rays 1s 1.15s forwards,spin 14s 1.15s linear infinite;-webkit-mask:radial-gradient(circle,#000 20%,transparent 65%);mask:radial-gradient(circle,#000 20%,transparent 65%)}
@keyframes rays{to{opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}
.fx svg.bolts{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.fx svg.bolts path{fill:none;stroke:#ddd6fe;stroke-width:2.5;filter:drop-shadow(0 0 6px #a78bfa) drop-shadow(0 0 14px #7c3aed);opacity:0;animation:bolt .5s forwards}
@keyframes bolt{0%{opacity:0}10%{opacity:1}30%{opacity:.2}45%{opacity:1}100%{opacity:0}}
.fx .flash{position:absolute;inset:0;background:#fff;opacity:0;animation:flash .45s 1.05s}
@keyframes flash{0%{opacity:0}15%{opacity:.85}100%{opacity:0}}
.fx .ttl{font-family:Rajdhani;font-weight:700;letter-spacing:.42em;color:#c4b5fd;font-size:22px;margin-top:6px;opacity:0;animation:up .5s 1.5s forwards}
.fx .sub{color:#d4d4dc;font-size:15px;margin-top:8px;opacity:0;animation:up .5s 1.7s forwards;text-align:center;padding:0 24px}
.fx .hint{position:absolute;bottom:40px;color:#5c5c66;font-size:12px;opacity:0;animation:up .5s 2.4s forwards}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fx .qframe{border:1px solid #7c3aed;padding:18px 26px;position:relative;text-align:center;opacity:0;animation:newIn .6s 1.15s forwards cubic-bezier(.2,1.6,.4,1);background:rgba(10,6,20,.8)}
.fig{width:44px;height:44px;flex:none;background:var(--p2);border-radius:10px}
.ach{display:inline-flex;flex-direction:column;align-items:center;width:25%;padding:8px 2px;text-align:center;vertical-align:top}
.ach .hx{width:44px;height:44px}
.ach .n{font-size:10.5px;margin-top:5px;line-height:1.2}
.ach.lock{opacity:.35}
</style>
</head>
<body>
<div id="app"></div>
<div id="wo"></div>
<div id="sheet"></div>
<div id="toast"></div>
<script>
"use strict";
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
const fmtN=n=>n==null?'':(Math.round(n*10)/10).toString();
const DAY=864e5;
function fmtDur(s){s=Math.max(0,Math.round(s));const hh=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return hh?`${hh}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`}
function fmtHM(s){s=Math.round(s/60);return Math.floor(s/60)?`${Math.floor(s/60)} h ${s%60} min`:`${s} min`}
function parseDur(t){if(!t)return null;const p=String(t).trim().split(':').map(Number);if(p.some(isNaN))return null;return p.reduce((a,b)=>a*60+b,0)}
function fmtDate(ts,o){return new Date(ts).toLocaleDateString('en-GB',o||{weekday:'short',day:'numeric',month:'short'})}
function weekStart(ts){const d=new Date(ts);d.setHours(0,0,0,0);const wd=(d.getDay()+6)%7;return d.getTime()-wd*DAY}
function weekKey(ts){const d=new Date(weekStart(ts));return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function toast(m){const d=document.createElement('div');d.textContent=m;$('#toast').appendChild(d);setTimeout(()=>d.remove(),2200)}
function paceStr(s){if(!s||!isFinite(s))return '–';return fmtDur(s)+' /km'}
function e1rm(kg,reps,cap=12){if(!reps||reps<=0||kg==null)return 0;if(reps===1)return kg;return kg*(1+Math.min(reps,cap)/30)}
const ICON={train:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"/></svg>',status:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2.8l8 4.6v9.2l-8 4.6-8-4.6V7.4z"/><path d="M12 7.5l4 2.3v4.4l-4 2.3-4-2.3V9.8z"/></svg>',history:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V11M10 20V5M16 20v-7M22 20H2"/></svg>'};

/* ============ exercise library ============ */
const MUSCLES={chest:'Chest',frontDelts:'Front Delts',sideDelts:'Side Delts',rearDelts:'Rear Delts',triceps:'Triceps',biceps:'Biceps',forearms:'Forearms / Grip',lats:'Lats',upperBack:'Upper Back',traps:'Traps',lowerBack:'Lower Back',abs:'Abs',obliques:'Obliques',quads:'Quads',hamstrings:'Hamstrings',glutes:'Glutes',adductors:'Adductors',abductors:'Abductors',calves:'Calves',neck:'Neck',fullBody:'Full Body',cardio:'Cardio'};
const GROUPS={Chest:['chest'],Back:['lats','upperBack','traps','lowerBack'],Shoulders:['frontDelts','sideDelts','rearDelts'],Arms:['biceps','triceps','forearms'],Legs:['quads','hamstrings','glutes','adductors','abductors','calves'],Core:['abs','obliques','lowerBack'],Other:['neck','fullBody','cardio']};
const AXIS_MUSCLES={push:['chest','frontDelts','sideDelts','triceps'],pull:['lats','upperBack','rearDelts','biceps','forearms','traps'],legs:['quads','hamstrings','glutes','adductors','abductors','calves'],core:['abs','obliques','lowerBack']};
const EQ={B:'Barbell',D:'Dumbbell',M:'Machine',C:'Cable',S:'Smith Machine',K:'Kettlebell',E:'EZ Bar',R:'Band',P:'Plate',X:'Other',W:'Bodyweight'};
const EQUIP=['Barbell','Dumbbell','Machine','Cable','Bodyweight','Smith Machine','Kettlebell','EZ Bar','Band','Plate','Other'];
const LIB_SRC=`Bench Press|chest|triceps,frontDelts|B,D,S,M
Incline Bench Press|chest|frontDelts,triceps|B,D,S,M
Decline Bench Press|chest|triceps|B,D,S
Chest Press|chest|triceps,frontDelts|M
Incline Chest Press|chest|frontDelts,triceps|M
Iso-Lateral Chest Press|chest|triceps|M
Chest Fly|chest|frontDelts|D,M,C
Incline Chest Fly|chest|frontDelts|D,C
Cable Crossover|chest|frontDelts|C
Low-to-High Cable Fly|chest|frontDelts|C
Pec Deck|chest||M
Floor Press|chest|triceps|B,D
Push Up|chest|triceps,frontDelts|W
Incline Push Up|chest|triceps|W
Decline Push Up|chest|frontDelts,triceps|W

function poseOf(ex){const n=ex.name.toLowerCase();const t=(r)=>r.test(n);
 if(t(/pull up|chin up|muscle up|hanging|toes to bar|dead hang|captain/))return 'hang';
 if(t(/pulldown/))return 'pulldown';
 if(t(/dip/))return 'dip';
 if(t(/incline (bench|chest|press|fly|curl)/))return 'incline';
 if(t(/bench press|floor press|chest fly|skullcrusher|jm press|pullover|svend|decline bench|lying leg curl/))return 'bench';
 if(t(/push up|plank|ab wheel|bird dog|burpee|superman/))return 'prone';
 if(t(/crunch|sit up|v-up|dead bug|hollow|dragon|russian twist|lying leg raise/)&&!t(/cable crunch/))return 'crunch';
 if(t(/cable crunch/))return 'crunch';
 if(t(/hip thrust|glute bridge/))return 'bridge';
 if(t(/lunge|split squat|step up/))return 'lunge';
 if(t(/squat|thruster|box jump|sled/))return 'squat';
 if(t(/deadlift|good morning|bent over|pendlay|t-bar|seal row|meadows|single arm row|swing|clean|snatch|rack pull|pull through|glute kickback|chest supported/))return 'hinge';
 if(t(/calf|tibialis/)&&!t(/seated|leg press/))return 'calf';
 if(t(/overhead|shoulder press|arnold|push press|landmine|handstand|pike|jerk/))return 'overhead';
 if(t(/lateral raise|upright row|front raise|rear delt|y raise|shrug|farmer/))return 'raise';
 if(t(/curl|pushdown|kickback|wrist|gripper|pinch|face pull|pallof|woodchopper/)&&!t(/leg curl/))return 'curl';
 if(t(/seated|machine|leg extension|leg curl|chest press|row|calf press|adduction|abduction|torso rotation|pec deck|leg press|hack|pendulum|belt/))return 'seated';
 if(t(/run|bike|rope|rowing|battle/))return 'run';
 return 'stand'}
function figSVG(ex,size=44){const p=POSES[poseOf(ex)];const L=(a,b,w,c,o)=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${o?`opacity="${o}"`:''}/>`;
 const mid=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];const G='#55555f';let s=p.props||'';
 s+=L(p.H,p.N,2.2,G)+L(p.N,p.P,4.6,G);p.legs.forEach(l=>{s+=L(l[0],l[1],3.4,G)+L(l[1],l[2],3,G)});p.arms.forEach(a=>{s+=L(a[0],a[1],2.6,G)+L(a[1],a[2],2.2,G)});s+=`<circle cx="${p.H[0]}" cy="${p.H[1]}" r="3.4" fill="${G}"/>`;
 const hi=(m,o)=>{const R='#ef4444';const um=mid(p.N,p.P,.5);
  if(['chest','upperBack','lats','traps'].includes(m))return L(mid(p.N,p.P,.1),um,4.6,R,o);
  if(['abs','obliques','lowerBack'].includes(m))return L(um,mid(p.N,p.P,.95),4.6,R,o);
  if(m==='glutes')return `<circle cx="${p.P[0]}" cy="${p.P[1]}" r="3" fill="${R}" opacity="${o}"/>`;
  if(['quads','hamstrings','adductors','abductors'].includes(m))return p.legs.map(l=>L(l[0],l[1],3.4,R,o)).join('');
  if(m==='calves')return p.legs.map(l=>L(l[1],l[2],3,R,o)).join('');
  if(['frontDelts','sideDelts','rearDelts'].includes(m))return p.arms.map(a=>`<circle cx="${a[0][0]}" cy="${a[0][1]}" r="2.6" fill="${R}" opacity="${o}"/>`).join('');
  if(['biceps','triceps'].includes(m))return p.arms.map(a=>L(a[0],a[1],2.6,R,o)).join('');
  if(m==='forearms')return p.arms.map(a=>L(a[1],a[2],2.2,R,o)).join('');
  if(m==='neck')return L(p.H,p.N,2.2,R,o);
  if(m==='fullBody'||m==='cardio')return L(p.N,p.P,4.6,R,o)+p.legs.map(l=>L(l[0],l[1],3.4,R,o)).join('');return ''};
 (ex.sec||[]).forEach(m=>s+=hi(m,.4));s+=hi(ex.muscle,1);
 return `<svg class="fig" viewBox="0 0 40 40" width="${size}" height="${size}" style="width:${size}px;height:${size}px">${s}</svg>`}

function idbPut(v){return new Promise((res,rej)=>{const tx=IDB.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).put(v,IDB_KEY);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}

function rnd(x,hand){return hand||x<30?Math.round(x*2)/2:Math.round(x/2.5)*2.5}
function wAt(oneRm,r){return oneRm/(1+r/30)}
function goalLine(id){const st=STD(id);const r=exRank(id);const B=bw();const f=factorOf(id);if(!r||r.v==null)return null;const ni=Math.min(7,Math.floor(r.v)+1);if(ni<1)return null;const reps=typicalReps(id);
 if(st.bw){const tot=B*(1+st.th[ni-1]);const add=wAt(tot,reps)-B;return `${RANKS[ni]}: ${add>0?'+'+rnd(add)+' kg':'BW'} × ${reps}${add<=0?'':''} or ${st.reps[ni-1]} reps`}
 const one=st.th[ni-1]*B/f;return `${RANKS[ni]}: ${rnd(wAt(one,reps),st.hand)} kg${st.hand?'/hand':''} × ${reps}`}
function rankCard(id){const st=STD(id);const ex=exById(id);const r=exRank(id);const B=bw();const f=factorOf(id);const cur=r&&r.v!=null?rankOf(r.v):null;const reps=typicalReps(id);const gl=goalLine(id);
 const rows=RANKS.slice(1).map((rr,i)=>{if(st.bw){const tot=B*(1+st.th[i]);const add=wAt(tot,reps)-B;return `<tr class="${cur===rr?'me':''}"><td>${rk(i+1,15)}</td><td>${i===0?'any rep':add>0?'+'+rnd(add)+' kg × '+reps:'BW × '+Math.max(1,Math.floor(30*(tot/B-1)))}</td><td>${st.reps[i]}</td></tr>`}
  const one=st.th[i]*B/f;return `<tr class="${cur===rr?'me':''}"><td>${rk(i+1,15)}</td><td>${rnd(wAt(one,reps),st.hand)} × ${reps}</td><td>${rnd(wAt(one,5),st.hand)} × 5</td></tr>`}).join('');
 return `<details class="card" style="padding:12px 14px"><summary><div class="row">${figSVG(ex,36)}<div class="sp"><div class="sm" style="font-weight:600">${h(ex.name)}</div><div class="xs mu">${gl?'Next → '+gl:'No data yet'}</div></div>${cur?rk(r.v,22):'<span class="mu">–</span>'}</div></summary>
 <table class="rt" style="margin-top:10px"><tr><th>RANK</th><th>${st.bw?'EXTRA WEIGHT':'WORKING SET'}${st.hand?' (PER HAND)':''}</th><th>${st.bw?'MAX REPS':'HEAVY SET'}</th></tr>${rows}</table>
 <div class="xs mu" style="margin-top:8px">${r?(st.bw?`You: best +${fmtN(Math.max(0,r.added||0))} kg (est. 1RM) · ${r.maxReps||'–'} max reps`:`You: best est. 1RM ${fmtN(r.best)} kg${f!==1?` · machine factor ${f}`:''}`):''}</div>
 <div class="row" style="margin-top:8px">${st.bw?`<button class="btn sm" data-act="setMaxReps" data-id="${id}">Max reps</button>`:''}</div></details>`}

function hav(a,b){const R=6371e3,r=Math.PI/180;const dLa=(b[0]-a[0])*r,dLo=(b[1]-a[1])*r;const x=Math.sin(dLa/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function parseGPX(text,fname){const doc=new DOMParser().parseFromString(text,'application/xml');const pts=[...doc.getElementsByTagName('trkpt')];if(!pts.length)throw new Error('No track points');const nm=(doc.querySelector('trk > name')||doc.querySelector('name'));const P=[];
 for(const p of pts){const ele=p.getElementsByTagName('ele')[0];const t=p.getElementsByTagName('time')[0];let hr=null,cad=null;for(const el of p.getElementsByTagName('*')){const ln=el.localName.toLowerCase();if(ln==='hr')hr=+el.textContent;else if(ln==='cad')cad=+el.textContent}
  P.push({lat:+p.getAttribute('lat'),lon:+p.getAttribute('lon'),ele:ele?+ele.textContent:null,t:t?Date.parse(t.textContent):null,hr,cad})}
 let dist=0,gain=0,loss=0,refE=null,hrS=0,hrN=0,hrMax=0,cadS=0,cadN=0,moving=0;const cum=[0];
 for(let i=1;i<P.length;i++){const d=hav([P[i-1].lat,P[i-1].lon],[P[i].lat,P[i].lon]);dist+=d;cum.push(dist);if(P[i].t&&P[i-1].t){const dt=(P[i].t-P[i-1].t)/1000;if(dt>0&&dt<30&&d/dt>.6)moving+=dt}}
 for(const p of P){if(p.ele!=null){if(refE==null)refE=p.ele;const df=p.ele-refE;if(df>=3){gain+=df;refE=p.ele}else if(df<=-3){loss-=df;refE=p.ele}}if(p.hr){hrS+=p.hr;hrN++;hrMax=Math.max(hrMax,p.hr)}if(p.cad){cadS+=p.cad;cadN++}}
 const t0=P[0].t,t1=P[P.length-1].t;const dur=t0&&t1?(t1-t0)/1000:0;
 const splits=[];let next=1000,lastT=t0,lastI=0;for(let i=1;i<P.length;i++){if(cum[i]>=next&&P[i].t){const seg=P.slice(lastI,i+1);const hs=seg.filter(q=>q.hr);splits.push({s:(P[i].t-lastT)/1000,hr:hs.length?Math.round(hs.reduce((a,q)=>a+q.hr,0)/hs.length):null,el:Math.round((P[i].ele??0)-(P[lastI].ele??0))});lastT=P[i].t;lastI=i;next+=1000}}
 const step=Math.max(1,Math.ceil(P.length/700));const track=[];for(let i=0;i<P.length;i+=step){const p=P[i];track.push([+p.lat.toFixed(5),+p.lon.toFixed(5),p.ele!=null?Math.round(p.ele):null,p.hr||null,p.t&&t0?Math.round((p.t-t0)/1000):null,Math.round(cum[i])])}
 const cadAvg=cadN?cadS/cadN:null;const r={id:'r_'+uid(),name:(nm&&nm.textContent.trim())||fname.replace(/\.gpx$/i,''),date:t0||Date.now(),dist:Math.round(dist),dur:Math.round(dur),moving:Math.round(moving),gain:Math.round(gain),loss:Math.round(loss),hrAvg:hrN?Math.round(hrS/hrN):null,hrMax:hrMax||null,cad:cadAvg?Math.round(cadAvg<120?cadAvg*2:cadAvg):null,type:dist>0&&gain/(dist/1000)>=25?'trail':'road',splits,track};
 // vam from full resolution
 let up=0,tu=0;for(let i=1;i<P.length;i++){const a=P[i-1],b=P[i];if(a.ele==null||b.ele==null||!a.t||!b.t)continue;const dE=b.ele-a.ele,dt=(b.t-a.t)/1000,dd=cum[i]-cum[i-1];if(dE>0&&dt>0&&dt<60&&(dd<=0||dE/dd>.04)){up+=dE;tu+=dt}}r.vam=tu>300?Math.round(up/tu*3600):null;return r}

 <div class="wobody"><div class="row" style="margin-bottom:2px"><div class="sp" style="font-size:22px;font-weight:700" data-act="woRename">${h(w.name)}</div><button class="iconbtn" data-act="woMenu">⋯</button></div>

 return `<div class="excard ${e.sup?'ss':''}"><div class="exname"><div class="n" data-act="exMenu" data-ei="${ei}">${h(ex.name)}${e.sup?' <span class="tag acc">SUPERSET</span>':''}${(()=>{const r=STD(e.ex)?exRank(e.ex):null;const gl=r?goalLine(e.ex):null;return gl?`<div class="xs" style="color:var(--mu);font-weight:500;margin-top:2px">${rk(r.v,12)} → ${h(gl)}</div>`:''})()}</div><button class="iconbtn" data-act="exInfo" data-ei="${ei}">↗</button><button class="iconbtn" data-act="exMenu" data-ei="${ei}">⋯</button></div>

function boltPaths(){let o='';for(let i=0;i<7;i++){let x=40+Math.random()*320,y=-10;let d=`M${x} ${y}`;const tx=200+(Math.random()-.5)*80,ty=300+(Math.random()-.5)*60;const n=7;for(let k=1;k<=n;k++){x+=(tx-x)/(n-k+1)+(Math.random()-.5)*60;y+=(ty-y)/(n-k+1)+(Math.random()-.5)*20;d+=` L${x.toFixed(0)} ${y.toFixed(0)}`}o+=`<path d="${d}" style="animation-delay:${(.15+Math.random()*.85).toFixed(2)}s"/>`}return o}

 document.body.appendChild(el);const close=()=>{el.style.transition='opacity .3s';el.style.opacity='0';setTimeout(()=>el.remove(),300)};el.onclick=close;setTimeout(()=>{if(el.isConnected)close()},6000)}
function celebrate(ei,si){const w=S.active,e=w.exs[ei],s=e.sets[si];const id=e.ex;const kg=num(s.kg)||0,reps=num(s.reps);if(!reps||s.t==='w')return;w.fx=w.fx||{};
 const Q=questData();
 if(id==='bench-press-barbell'){const q=Q.find(x=>x.q==='bench');if(q&&kg>=q.tg&&!w.fx['qb'+q.tg]){w.fx['qb'+q.tg]=1;const nxt=[100,105,110,115,120,125,130,140,150].find(x=>x>kg)||kg+5;showFX(null,null,'QUEST COMPLETE',`Bench press ${kg} kg × ${reps} · next: ${nxt} kg × 1`,{t:'Main quest',goal:`${q.tg} kg × 1`});return}}
 if(id==='pull-up'&&!kg){const q=Q.find(x=>x.q==='pull');if(q&&reps>=q.tg&&!w.fx['qp'+q.tg]){w.fx['qp'+q.tg]=1;showFX(null,null,'QUEST COMPLETE',`${reps} pull-ups in one set`,{t:'Main quest',goal:`${q.tg} reps`});return}}
 if(!STD(id))return;const done=(x,j)=>x.done&&x.t!=='w'&&num(x.reps)&&j!==si;
 const prev=e.sets.map((x,j)=>done(x,j)?{kg:num(x.kg)||0,reps:num(x.reps)}:null).filter(Boolean);const before=exRank(id,null,prev);const after=exRank(id,null,prev.concat([{kg,reps}]));
 if(!after||after.v==null)return;const b=before&&before.v!=null?Math.floor(before.v):-1,a=Math.floor(after.v);
 if(a>b&&b>=0&&!w.fx['r'+id+a]){w.fx['r'+id+a]=1;const isLeg=id==='seated-leg-press-machine';showFX(RANKS[b],RANKS[a],isLeg?'QUEST COMPLETE':'RANK UP',`${exById(id).name} · ${kg?kg+' kg × ':''}${reps}${kg?'':' reps'}`)}}

 if(s.reps===''||num(s.reps)==null){toast('Enter reps first');return}s.done=true;woSave();try{celebrate(ei,si)}catch(err){console.warn(err)}
 if(e.sup){const grp=S.active.exs.map((x,i)=>[x,i]).filter(([x])=>x.sup===e.sup);if(ei!==grp[grp.length-1][1]){renderWO();return}}startRest(ei,si)}

  const out=JSON.parse(JSON.stringify(w));out.end=Date.now();out.exs=out.exs.map(e=>({...e,sets:e.sets.filter(s=>s.done).map(s=>({t:s.t,kg:num(s.kg)??0,reps:num(s.reps)}))})).filter(e=>e.sets.length);
  if(!out.exs.length){toast('No completed sets – nothing saved');S.active=null;persist('lv/active');UI.woOpen=false;REST=null;renderWO();render();return}
  const prs=[];for(const e of out.exs){const ex=exById(e.ex);const old=bestE1(e.ex);let b=0;for(const s of e.sets)if(s.t!=='w')b=Math.max(b,e1rm(ex.type==='bwp'?bw()+s.kg:s.kg,s.reps));if(old&&b>old+.01)prs.push([ex.name,b,old])}
  const before=axes(),achB=new Set(achievements().filter(a=>a.done).map(a=>a.id)),lvB=xpInfo().lvl;

/* ---------- reorder ---------- */
function openReorder(items,cb){const H=58;let order=items.map((_,i)=>i);
 sheet(`<h3>Reorder</h3><p class="xs mu">Drag ≡ to move</p><div>${items.map((t,i)=>`<div class="ro-item" data-i="${i}"><span class="hdl">≡</span><span class="sp">${h(t)}</span></div>`).join('')}</div><button class="btn pri full" id="rook" style="margin-top:10px">Done</button>`,'tall');
 const els=[...document.querySelectorAll('.ro-item')];let drag=null;
 const layout=()=>{order.forEach((idx,pos)=>{const el=els[idx];if(drag&&drag.idx===idx)return;el.style.transform=`translateY(${(pos-idx)*H}px)`;el.style.transition='transform .15s'})};
 els.forEach((el,idx)=>{const hd=el.querySelector('.hdl');hd.addEventListener('pointerdown',e=>{e.preventDefault();hd.setPointerCapture(e.pointerId);drag={idx,y0:e.clientY,pos0:order.indexOf(idx)};el.classList.add('drag');el.style.transition='none'});
  hd.addEventListener('pointermove',e=>{if(!drag||drag.idx!==idx)return;const dy=e.clientY-drag.y0;const np=clamp(Math.round(drag.pos0+dy/H),0,order.length-1);order=order.filter(x=>x!==idx);order.splice(np,0,idx);el.style.transform=`translateY(${(drag.pos0-idx)*H+dy}px)`;layout()});
  const up=()=>{if(!drag||drag.idx!==idx)return;el.classList.remove('drag');drag=null;layout()};hd.addEventListener('pointerup',up);hd.addEventListener('pointercancel',up)});
 $('#rook').onclick=()=>{closeSheet();cb(order)}}

/* ---------- plan editor ---------- */
let PE=null;
function editPlan(id){const p=id?S.plans.find(x=>x.id===id):{id:'p_'+uid(),name:'New Plan',gym:'',exs:[]};PE={p:JSON.parse(JSON.stringify(p)),isNew:!id};renderPE()}
function renderPE(){const p=PE.p;sheet(`<div class="row" style="margin-bottom:10px"><h3 class="sp" style="margin:0">${PE.isNew?'New plan':'Edit plan'}</h3><button class="btn sm" id="peExp">Export</button></div>
 <div class="grid2"><div class="field"><label>NAME</label><input id="pe_n" value="${h(p.name)}"></div><div class="field"><label>LOCATION</label><input id="pe_g" value="${h(p.gym||'')}" list="gymlist"><datalist id="gymlist">${(S.settings.gyms||[]).map(g=>`<option>${h(g)}</option>`).join('')}</datalist></div></div>
 ${p.exs.map((e,i)=>{const ex=exById(e.ex);return `<div class="card" style="padding:10px"><div class="row">${figSVG(ex,36)}<div class="sp" style="font-weight:600">${h(ex.name)}</div><button class="iconbtn" data-pe="rep" data-i="${i}">⇄</button><button class="iconbtn" data-pe="del" data-i="${i}">✕</button></div>
  <div class="row" style="margin-top:8px"><span class="xs mu">SETS</span><button class="iconbtn" data-pe="minus" data-i="${i}">−</button><b style="min-width:18px;text-align:center">${e.sets.filter(t=>t!=='w').length}</b><button class="iconbtn" data-pe="plus" data-i="${i}">+</button><span class="sp"></span><button class="btn sm" data-pe="warm" data-i="${i}">${e.sets[0]==='w'?'✓ ':''}Warm-up</button><button class="btn sm" data-pe="rest" data-i="${i}">${fmtDur(e.rest||S.settings.rest)}</button></div>
  <input class="note" data-pen="${i}" value="${h(e.note||'')}" placeholder="Note (e.g. seat setting)" style="margin-top:8px"></div>`}).join('')}
 <div class="grid2"><button class="btn" id="peAdd">+ Exercise</button><button class="btn" id="peRo" ${p.exs.length<2?'disabled':''}>Reorder</button></div>
 <div class="grid2" style="margin-top:10px">${PE.isNew?'<span></span>':'<button class="btn bad" id="peDel">Delete plan</button>'}<button class="btn pri" id="peSave">Save</button></div>`,'tall');
 const sync=()=>{p.name=$('#pe_n').value.trim()||'Plan';p.gym=$('#pe_g').value.trim();document.querySelectorAll('[data-pen]').forEach(i=>p.exs[+i.dataset.pen].note=i.value)};
 document.querySelectorAll('[data-pe]').forEach(b=>b.onclick=()=>{sync();const i=+b.dataset.i,e=p.exs[i],a=b.dataset.pe;
  if(a==='del')p.exs.splice(i,1);if(a==='minus'&&e.sets.filter(t=>t!=='w').length>1){const k=e.sets.lastIndexOf('n');e.sets.splice(k>=0?k:e.sets.length-1,1)}if(a==='plus')e.sets.push('n');if(a==='warm'){if(e.sets[0]==='w')e.sets.shift();else e.sets.unshift('w')}
  if(a==='rest'){restSheet(s=>{e.rest=s;renderPE()},e.rest);return}if(a==='rep'){openPicker(ids=>{e.ex=ids[0];renderPE()},false);return}renderPE()});
 $('#peAdd').onclick=()=>{sync();openPicker(ids=>{ids.forEach(id=>p.exs.push({ex:id,sets:['n','n','n'],rest:S.settings.rest,note:''}));renderPE()})};
 $('#peRo').onclick=()=>{sync();openReorder(p.exs.map(e=>exById(e.ex).name),o=>{p.exs=o.map(i=>p.exs[i]);renderPE()})};
 $('#peSave').onclick=()=>{sync();const i=S.plans.findIndex(x=>x.id===p.id);if(i>=0)S.plans[i]=p;else S.plans.push(p);if(p.gym&&!S.settings.gyms.includes(p.gym)){S.settings.gyms.push(p.gym);persist('lv/settings')}persist('lv/plans');closeSheet();render();toast('Plan saved')};
 const d=$('#peDel');if(d)d.onclick=()=>confirmSheet('Delete plan?',`"${h(p.name)}" will be removed. History stays.`,'Delete',()=>{S.plans=S.plans.filter(x=>x.id!==p.id);persist('lv/plans');render()},true);
 $('#peExp').onclick=()=>{sync();copyText(JSON.stringify(planExport(p),null,1),'Plan code copied')}}
function planExport(p){return {type:'hunter-plan',name:p.name,gym:p.gym||'',exercises:p.exs.map(e=>({name:exById(e.ex).name,sets:e.sets.filter(t=>t!=='w').length,warmup:e.sets.includes('w'),rest:e.rest||S.settings.rest,note:e.note||''}))}}
function copyText(t,msg){try{navigator.clipboard.writeText(t).then(()=>toast(msg||'Copied'),()=>showText(t))}catch(e){showText(t)}}
function showText(t){sheet(`<h3>Copy this</h3><textarea style="height:50vh;font-size:12px" readonly>${h(t)}</textarea>`,'tall')}
function importPlanSheet(){sheet(`<h3>Import plan</h3><p class="sm mu">Paste a plan code from the chat with Claude.</p><textarea id="ipt" style="height:40vh;font-size:12px" placeholder='{"type":"hunter-plan","name":"Push Day","exercises":[{"name":"Bench Press (Barbell)","sets":3}]}'></textarea><button class="btn pri full" id="ipok" style="margin-top:10px">Import</button>`,'tall');
 $('#ipok').onclick=()=>{let j;try{j=JSON.parse($('#ipt').value.trim().replace(/^```(json)?|```$/g,''))}catch(e){toast('Invalid code');return}
  const plans=Array.isArray(j)?j:j.plans||[j];let n=0;for(const q of plans){if(!q.exercises)continue;const p={id:'p_'+uid(),name:q.name||'Imported plan',gym:q.gym||'',exs:[]};
   for(const x of q.exercises){const nm=String(x.name||'').trim();if(!nm)continue;let ex=allEx().find(e=>e.name.toLowerCase()===nm.toLowerCase());if(!ex){ex={id:'c_'+uid(),name:nm,eq:x.equipment||'Other',muscle:MUSCLES[x.muscle]?x.muscle:'fullBody',sec:[],type:x.bodyweight?'bwp':'w'};S.customEx.push(ex)}
    const sets=Array(Math.max(1,+x.sets||3)).fill('n');if(x.warmup)sets.unshift('w');p.exs.push({ex:ex.id,sets,rest:+x.rest||S.settings.rest,note:x.note||''})}S.plans.push(p);n++}

  $('#rbf').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{$('#rbt').value=await f.text();toast('File loaded – tap "Replace all data"')}catch(err){toast('Could not read file')}};
  $('#rbok').onclick=()=>{let j;try{j=JSON.parse($('#rbt').value.replace(/^﻿/,'').trim())}catch(e){toast('Invalid backup');return}if(!j.hunterBackup){toast('Not a backup');return}const oldW=Object.keys(S.workouts),oldR=Object.keys(S.runs);
   S.settings=Object.assign({},DEF_SETTINGS,j.settings);S.plans=j.plans||[];S.customEx=j.customEx||[];S.checkins=j.checkins||[];S.fitness=j.fitness||{log:[]};S.workouts=j.workouts||{};S.runs=j.runs||{};
   ['lv/settings','lv/plans','lv/exercises','lv/checkins','lv/fitness'].forEach(persist);[...new Set([...oldW,...Object.keys(S.workouts)])].forEach(id=>persist('workouts/'+id));[...new Set([...oldR,...Object.keys(S.runs)])].forEach(id=>persist('runs/'+id));closeSheet();render();toast('Backup restored')}}}

/* ============ imported history (static file beside the page) ============ */
async function loadImport(){try{const r=await fetch('strong-history.json');if(!r.ok)return;const j=await r.json();const hid=new Set(S.settings.hiddenImports||[]);let n=0;
 for(const w of j.workouts||[]){if(hid.has(w.id)||S.workouts[w.id])continue;S.workouts[w.id]=w;n++}if(n){render()}}catch(e){console.warn('import',e)}}
/* ============ boot ============ */
UI.woOpen=false;UI.tab='status';initStore().finally(()=>{render();loadImport()});
if('serviceWorker' in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn('sw',e)));
</script>
</body>
</html>
